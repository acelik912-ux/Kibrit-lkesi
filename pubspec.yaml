name: kibrit_ulke
description: Kareli deftere ülke çizip kibrit kutusu atarak oynanan çok oyunculu oyun.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Uygulama simgesi (derlemede: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/ikon/ikon.png
  adaptive_icon_background: "#5A3216"
  adaptive_icon_foreground: assets/ikon/ikon_on.png
  min_sdk_android: 21
