name: Derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Eksik platform dosyalarını oluştur
        run: flutter create . --project-name kibrit_ulke --org com.acelik --platforms android,ios,web
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  web:
    name: Web sürümü (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter create . --project-name kibrit_ulke --org com.acelik --platforms android,ios,web
      - run: flutter pub get
      - name: Web derle
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter create . --project-name kibrit_ulke --org com.acelik --platforms android,ios,web
      - run: flutter pub get
      - name: APK derle
        run: flutter build apk --release
      - name: APK'yı yeniden adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk kibrit-ulkesi.apk
      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Kibrit Ülkesi ${{ github.run_number }}
          body: Telefona indirip kurmak için kibrit-ulkesi.apk dosyasına dokun.
          files: kibrit-ulkesi.apk
          make_latest: true
