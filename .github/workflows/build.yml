name: Derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Eksik platform dosyalarını oluştur
        run: flutter create . --project-name kibrit_ulke --org com.acelik --platforms android,ios,web
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testleri çalıştır
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-kaydi.txt
      - name: Test kaydını test-kaydi dalına koy
        if: always()
        run: |
          mkdir -p kayit && cp test-kaydi.txt kayit/ 2>/dev/null || echo "kayıt yok" > kayit/test-kaydi.txt
          cd kayit
          git init -q -b test-kaydi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Test kaydı ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" test-kaydi

  web:
    name: Web sürümü (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest
    # Pages ayarı açılana kadar bu adım başarısız olur; APK'yı etkilemesin.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter create . --project-name kibrit_ulke --org com.acelik --platforms android,ios,web
      - run: flutter pub get
      - name: Web derle
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter create . --project-name kibrit_ulke --org com.acelik --platforms android
      - name: Android ayarları (ad, izin, dikey ekran)
        run: bash scripts/android_ayarla.sh
      - name: Sabit imza (güncellemeler üstüne kurulabilsin)
        run: mkdir -p ~/.android && cp android_imza/debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - name: Uygulama simgesi
        run: dart run flutter_launcher_icons
      - name: APK derle (tüm telefonlar)
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk kibrit-ulkesi.apk
      - name: Küçük APK derle (çoğu yeni telefon, arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk kibrit-ulkesi-kucuk.apk
      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Kibrit Ülkesi ${{ github.run_number }}
          body: |
            kibrit-ulkesi-kucuk.apk → çoğu telefon için (daha küçük, hızlı iner)
            kibrit-ulkesi.apk → küçük olan kurulmazsa bunu dene
          files: |
            kibrit-ulkesi-kucuk.apk
            kibrit-ulkesi.apk
          make_latest: true

  ekran:
    name: Ekran testi (oyunu tarayıcıda oyna)
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter create . --project-name kibrit_ulke --org com.acelik --platforms web
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Oyunu oyna ve ekran görüntüsü al
        run: |
          (cd build/web && python -m http.server 8000 &) 
          sleep 2
          python scripts/ekran_testi.py http://localhost:8000/ ekranlar
      - name: Görüntüleri ekran-testi dalına koy
        if: always()
        run: |
          cd ekranlar
          git init -q -b ekran-testi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Ekran testi ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ekran-testi
